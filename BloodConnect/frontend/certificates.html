<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Certificates | BloodConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --red: #d7193f;
            --red-dark: #b91435;
            --red-soft: #fff1f4;
            --dark: #17191d;
            --text: #30343b;
            --muted: #747b85;
            --border: #e9eaed;
            --background: #f7f8fa;
            --white: #ffffff;
            --green: #168653;
            --green-soft: #eaf8f0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        .page-shell {
            min-height: 100vh;
        }

        .topbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--dark);
            font-size: 21px;
            font-weight: 750;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--red);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand span {
            color: var(--red);
        }

        .back-btn {
            text-decoration: none;
            color: #555b64;
            border: 1px solid var(--border);
            background: white;
            border-radius: 9px;
            padding: 9px 14px;
            font-size: 12px;
            font-weight: 650;
        }

        .back-btn:hover {
            color: var(--red);
            border-color: #ddd;
        }

        .page-content {
            max-width: 1100px;
            margin: auto;
            padding: 55px 25px 80px;
        }

        .page-heading {
            margin-bottom: 35px;
        }

        .page-label {
            color: var(--red);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 9px;
            display: block;
        }

        .page-heading h1 {
            font-size: 32px;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .page-heading p {
            color: var(--muted);
            font-size: 14px;
        }

        .certificate-list {
            display: grid;
            gap: 18px;
        }

        .certificate-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .certificate-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .certificate-icon {
            width: 55px;
            height: 55px;
            border-radius: 13px;
            background: var(--red-soft);
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            flex-shrink: 0;
        }

        .certificate-info h3 {
            font-size: 16px;
            color: var(--dark);
            margin-bottom: 7px;
        }

        .certificate-info p {
            color: var(--muted);
            font-size: 12px;
            margin: 4px 0;
        }

        .certificate-status {
            color: var(--green);
            background: var(--green-soft);
            border-radius: 7px;
            padding: 6px 9px;
            font-size: 10px;
            font-weight: 750;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 7px;
        }

        .certificate-actions {
            display: flex;
            gap: 9px;
            flex-shrink: 0;
        }

        .certificate-btn {
            border: 0;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .certificate-btn.primary {
            background: var(--red);
            color: white;
        }

        .certificate-btn.primary:hover {
            background: var(--red-dark);
        }

        .certificate-btn.secondary {
            background: #f3f4f5;
            color: #555b64;
            border: 1px solid #e1e2e5;
        }

        .certificate-btn.secondary:hover {
            background: #e9eaec;
        }

        .empty-state {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            text-align: center;
            padding: 65px 20px;
        }

        .empty-state i {
            font-size: 38px;
            color: #c6cad0;
            display: block;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: var(--dark);
            font-size: 17px;
            margin-bottom: 7px;
        }

        .empty-state p {
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .topbar {
                padding: 0 18px;
            }

            .certificate-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .certificate-actions {
                width: 100%;
            }

            .certificate-btn {
                flex: 1;
                justify-content: center;
            }

            .page-content {
                padding: 35px 16px 60px;
            }

        }

    </style>

</head>

<body>

<div class="page-shell">

    <header class="topbar">

        <a href="/" class="brand">

            <div class="brand-icon">
                <i class="bi bi-droplet-fill"></i>
            </div>

            Blood<span>Connect</span>

        </a>

        <a href="/dashboard.html" class="back-btn">
            <i class="bi bi-arrow-left"></i>
            Dashboard
        </a>

    </header>


    <main class="page-content">

        <div class="page-heading">

            <span class="page-label">
                DONATION RECORDS
            </span>

            <h1>My Certificates</h1>

            <p>
                Official certificates for your verified blood donations.
            </p>

        </div>


        <div
            id="certificateList"
            class="certificate-list"
        >

            <div class="empty-state">

                <i class="bi bi-award"></i>

                <h3>
                    Loading certificates...
                </h3>

                <p>
                    Please wait while we load your verified donations.
                </p>

            </div>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>
